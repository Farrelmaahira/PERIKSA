name: periksa

services:
  # Stack DB lokal. Tidak dipakai backend selama backend/.env menunjuk Postgres Azure;
  # jalankan dengan `docker compose --profile local-db up` bila ingin DB lokal.
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: periksa
    ports:
      - "5432:5432"
    volumes:
      - periksa_postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/compat_datetime.sql:/docker-entrypoint-initdb.d/00_compat_datetime.sql
      - ./backend/scripts/PERIKSA.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/scripts/seed_villages.sql:/docker-entrypoint-initdb.d/02_seed_villages.sql
      - ./backend/scripts/seed_demo.sql:/docker-entrypoint-initdb.d/03_seed_demo.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d periksa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["local-db"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: periksa-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Seluruh konfigurasi (DB Azure, AI engine Azure, storage) dibaca dari backend/.env.
    # Catatan: backend/.env menunjuk Postgres produksi; IP publik mesin ini harus
    # diizinkan di Azure Database for PostgreSQL > Networking sebelum container bisa start.
    env_file:
      - ./backend/.env

  ai-engine:
    build: ./ai-engine
    image: periksa-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "50051:50051"
    # AI engine memakai .env root sebagai sumber konfigurasi bersama.
    env_file:
      - ./.env

  frontend:
    build:
      context: ./frontend
      # Tanpa build args: NEXT_PUBLIC_* dibaca Next dari frontend/.env saat build.
    image: periksa-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      # Di dalam jaringan compose, ringkasan AI memakai ai-engine lokal.
      - AI_ENGINE_URL=http://ai-engine:8000
      - AI_API_KEY=${AI_API_KEY:-periksa-ai-secret-key-development}
    depends_on:
      - ai-engine

volumes:
  periksa_postgres_data:
